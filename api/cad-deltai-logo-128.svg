<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-6 -6 140 140" role="img" aria-labelledby="title desc">
  <title id="title">CAD-DELTΔI corrected animated logo 128</title>
  <desc id="desc">Centered delta rotates two times by 120 degrees, with a 500 ms pause and C/D color swap at each stop, then animation freezes.</desc>
  
  <style>
    .deltaSpin {
      transform-box: view-box;
      transform-origin: 64px 64px;
      animation: cadDeltaiDeltaSpin 2.4s ease-in-out 0s 1 forwards;
    }
    .arcC { animation: cadDeltaiArcC 2.4s linear 0s 1 forwards; }
    .arcD { animation: cadDeltaiArcD 2.4s linear 0s 1 forwards; }
    @keyframes cadDeltaiDeltaSpin {
      0% { transform: rotate(0deg); }
      29.166% { transform: rotate(120deg); }
      50% { transform: rotate(120deg); }
      79.166% { transform: rotate(240deg); }
      100% { transform: rotate(240deg); }
    }
    @keyframes cadDeltaiArcC {
      0%,29.15% { fill: #ffffff; }
      29.17%,79.15% { fill: #0084f8; }
      79.17%,100% { fill: #ffffff; }
    }
    @keyframes cadDeltaiArcD {
      0%,29.15% { fill: #0084f8; }
      29.17%,79.15% { fill: #ffffff; }
      79.17%,100% { fill: #0084f8; }
    }
  </style>
