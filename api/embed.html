<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sm&#916;rt API — Embedded</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #0f1119;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100dvh;
        padding: 5dvh 0;
      }

      .api-frame-wrap {
        width: 460px;
        max-width: 100vw;
        height: 90dvh;
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
          0 8px 40px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(99, 102, 241, 0.2);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
        border-radius: 12px;
      }

      /* Mobile: full screen below 500px */
      @media (max-width: 500px) {
        body {
          padding: 0;
          align-items: stretch;
        }
        .api-frame-wrap {
          width: 100vw;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        iframe {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="api-frame-wrap">
      <iframe
        src="https://api.caddeltai.com/api/api-settings.html?embed=true"
        title="Sm&#916;rt API Settings"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-storage-access-by-user-activation"
        loading="eager"
      ></iframe>
    </div>
  </body>
</html>
