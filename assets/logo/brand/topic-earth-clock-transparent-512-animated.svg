<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">topic.earth transparent Earth clock</title>
  <desc id="desc">Transparent isolated Earth clock logo using the rotating Earth animation and live local-time hands.</desc>
  <defs>
    <linearGradient id="ringGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="48%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#ff3030"/>
    </linearGradient>
    <radialGradient id="edgeLight" cx="35%" cy="24%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="42%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="earthClip" clipPathUnits="userSpaceOnUse">
      <circle cx="256" cy="256" r="214"/>
    </clipPath>
  </defs>
  <style>
    .earth { filter: drop-shadow(0 0 22px rgba(0, 212, 255, 0.38)); }
    .ring {
      fill: none;
      stroke: url(#ringGradient);
      stroke-width: 14;
      opacity: 0.94;
      stroke-linecap: round;
      transform-origin: 256px 256px;
      animation: ringBreath 6.4s ease-in-out infinite;
    }
    .orbit {
      fill: none;
      stroke: rgba(255,255,255,0.32);
      stroke-width: 3;
      stroke-dasharray: 18 22;
      transform-origin: 256px 256px;
      animation: orbitTurn 28s linear infinite;
    }
    .hand { stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .hour-hand { stroke: #39ff88; stroke-width: 18; }
    .minute-hand { stroke: #00d4ff; stroke-width: 10; }
    .second-hand { stroke: #ff3030; stroke-width: 6; }
    .pin { fill: #05070a; stroke: rgba(255,255,255,0.86); stroke-width: 5; }
    @keyframes ringBreath {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 8px rgba(0,212,255,0.3)); }
      50% { opacity: 1; filter: drop-shadow(0 0 18px rgba(57,255,136,0.45)); }
    }
    @keyframes orbitTurn { to { transform: rotate(360deg); } }
  </style>
  <ellipse class="orbit" cx="256" cy="256" rx="238" ry="86" transform="rotate(-14 256 256)"/>
  <image class="earth" href="../generated/earth-rotate/topic-earth-logo-earth-rotate-512.webp" x="42" y="42" width="428" height="428" preserveAspectRatio="xMidYMid slice" clip-path="url(#earthClip)"/>
  <circle cx="256" cy="256" r="214" fill="url(#edgeLight)" clip-path="url(#earthClip)"/>
  <circle class="ring" cx="256" cy="256" r="220"/>
  <g clip-path="url(#earthClip)">
    <line class="hand hour-hand" x1="256" y1="264" x2="256" y2="140"/>
    <line class="hand minute-hand" x1="256" y1="270" x2="256" y2="88"/>
    <line class="hand second-hand" x1="256" y1="280" x2="256" y2="66"/>
  </g>
  <circle class="pin" cx="256" cy="256" r="20"/>
  <script><![CDATA[
    (function () {
      function setHands() {
        const now = new Date();
        const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
        const minutes = now.getMinutes() + seconds / 60;
        const hours = (now.getHours() % 12) + minutes / 60;
        [
          [".hour-hand", hours * 30],
          [".minute-hand", minutes * 6],
          [".second-hand", seconds * 6]
        ].forEach(([selector, angle]) => {
          document.querySelector(selector).setAttribute("transform", "rotate(" + angle + " 256 256)");
        });
        requestAnimationFrame(setHands);
      }
      setHands();
    }());
  ]]></script>
</svg>
