<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">topic.earth — Wallonia.be, exemple de réseau citoyen régional</title>
  <desc id="desc">Un globe relie trois groupes citoyens : jardin et compost, outils et réparation, trajets partagés. Schéma illustratif, sans frontières géographiques ni partenaires confirmés.</desc>
