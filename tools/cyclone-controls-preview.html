<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>topic.earth · cyclone source and geometry check</title><style>
:root{color-scheme:dark;font:16px/1.5 system-ui;background:#071019;color:#e8eaed}*{box-sizing:border-box}body{margin:0;padding:14px}header,nav{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}button{font:inherit;color:inherit;background:#141824;border:1px solid #00d4ff;border-radius:9px;padding:9px;cursor:pointer}button[aria-pressed=true]{background:#073843}.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}.view{position:relative;min-height:490px;border:1px solid #00d4ff55;border-radius:16px;overflow:hidden;background:#040a13}canvas{display:block;width:100%;height:520px}.names{position:absolute;inset:0;pointer-events:none}.names button{position:absolute;transform:translate(-50%,-50%);padding:4px 8px;font-size:13px;white-space:nowrap;pointer-events:auto}.topics{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#story{max-height:740px;overflow:auto;border-radius:16px}#story article{padding:18px!important}small{color:#a8bdcc}#status{margin:5px 0 14px}#error{color:#ffb020}@media(max-width:760px){.layout{grid-template-columns:1fr}canvas{height:400px}.view{min-height:400px}#story{max-height:none}.names button{font-size:12px}.topics button{flex:1 1 120px}}
</style></head><body><header><strong>🌀 World tropical cyclones</strong><button id="refresh">↻ Refresh sources</button><label><input id="layer" type="checkbox" checked> World layer</label></header><small>Source / geometry verification view. This canvas projects the production Three.js marker geometry without requiring WebGL.</small><p id="status" role="status">Checking agency feeds…</p><p id="error" role="alert"></p><nav aria-label="Globe view"><button data-lon="180" aria-pressed="true">Pacific</button><button data-lon="-40">Atlantic</button><button data-lon="80">Indian Ocean</button><button data-lon="140">Australia / west Pacific</button></nav><main class="layout"><section><div class="view"><canvas aria-label="Cyclone spiral globe"></canvas><div class="names"></div></div><div class="topics" aria-label="Cyclone topics"></div></section><section id="story" aria-label="Selected cyclone topic"></section></main>
<script type="module">
import * as THREE from '../vendor/three/three.mjs';
import {fetchLiveCyclones,buildCycloneTopics} from '../lib/tropical-cyclones.mjs?v=cyclones-20261013';
import {attachCycloneVisual,animateCycloneMarker} from '../lib/cyclone-visuals.mjs?v=cyclones-20261013';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),labels=document.querySelector('.names'),status=document.getElementById('status');
let snapshot=null,topics=[],markers=[],centerLon=180,selected=null,background=null,lastFrame=0;
const vector=(lat,lon,r=1)=>{const p=(90-lat)*Math.PI/180,t=(lon+180)*Math.PI/180;return new THREE.Vector3(-r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t));};
const select=point=>{selected=point.id;document.getElementById('story').innerHTML=point.topicStory.html;document.querySelectorAll('.topics button').forEach(button=>button.setAttribute('aria-pressed',button.dataset.id===selected));};
function rebuild(){
 markers.forEach(marker=>marker.traverse(node=>{node.geometry?.dispose?.();node.material?.dispose?.();}));markers=[];labels.replaceChildren();document.querySelector('.topics').replaceChildren();
 for(const point of topics){const button=document.createElement('button');button.textContent=point.isTropicalCyclone?'🌀 '+point.cyclone.name:'Sources / El Niño';button.dataset.id=point.id;button.onclick=()=>select(point);document.querySelector('.topics').append(button);
  if(!point.isTropicalCyclone)continue;const marker=new THREE.Mesh(new THREE.SphereGeometry(.008),new THREE.MeshBasicMaterial({color:point.markerColor}));marker.position.copy(vector(point.lat,point.lon,1.01));marker.userData={...point};attachCycloneVisual(THREE,marker,point,vector,{makeCanvas:null});markers.push(marker);
  const label=document.createElement('button');label.textContent=point.cyclone.name;label.style.borderColor=point.markerColor;label.onclick=()=>select(point);labels.append(label);marker.userData.label=label;
 }select(topics.find(point=>point.id===selected) || topics.find(point=>point.cyclone?.name==='Simon') || topics[0]);
}
async function refresh(){const button=document.getElementById('refresh');button.disabled=true;status.textContent='Checking agency feeds…';snapshot=await fetchLiveCyclones({previous:snapshot});topics=buildCycloneTopics(snapshot);rebuild();const failed=Object.entries(snapshot.sources).filter(([,value])=>!value.ok).map(([key])=>key.toUpperCase());status.textContent=`${snapshot.storms.length} systems · checked ${snapshot.fetchedAt.replace('T',' ').replace('.000Z',' UTC')} · ${failed.length?'Partial / unavailable: '+failed.join(', '):'NOAA/NHC · JMA · JTWC Pacific + Indian feeds connected'}`;button.disabled=false;}
document.getElementById('refresh').onclick=refresh;
document.querySelectorAll('[data-lon]').forEach(button=>button.onclick=()=>{centerLon=Number(button.dataset.lon);background=null;document.querySelectorAll('[data-lon]').forEach(item=>item.setAttribute('aria-pressed',item===button));});
const texture=new Image();let textureData=null;texture.onload=()=>{const source=document.createElement('canvas');source.width=texture.width;source.height=texture.height;const c=source.getContext('2d');c.drawImage(texture,0,0);textureData=c.getImageData(0,0,texture.width,texture.height);background=null;};texture.src='../assets/textures/main/Material.001_baseColor_1k.jpeg';
function sphereBackdrop(width,height,radius){const b=document.createElement('canvas');b.width=width;b.height=height;const c=b.getContext('2d');const image=c.createImageData(width,height),angle=centerLon*Math.PI/180;
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){const nx=(x-width/2)/radius,ny=(height/2-y)/radius,z2=1-nx*nx-ny*ny;if(z2<0)continue;const nz=Math.sqrt(z2),vx=Math.cos(angle)*nz-Math.sin(angle)*nx,vz=-Math.sin(angle)*nz-Math.cos(angle)*nx,lat=Math.asin(ny),lon=Math.atan2(-vz,vx),at=(y*width+x)*4;let rgb=[9,36,53];if(textureData){const tx=Math.min(texture.width-1,Math.max(0,Math.floor((lon+Math.PI)/(2*Math.PI)*texture.width))),ty=Math.min(texture.height-1,Math.max(0,Math.floor((Math.PI/2-lat)/Math.PI*texture.height))),i=(ty*texture.width+tx)*4;rgb=[textureData.data[i],textureData.data[i+1],textureData.data[i+2]];}const light=.35+.65*nz;for(let j=0;j<3;j++)image.data[at+j]=rgb[j]*light;image.data[at+3]=255;}c.putImageData(image,0,0);return b;}
function draw(time){requestAnimationFrame(draw);if(time-lastFrame<50)return;lastFrame=time;const width=Math.round(canvas.clientWidth),height=Math.round(canvas.clientHeight);if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;background=null;}const r=Math.min(width,height)*.42,a=centerLon*Math.PI/180,front=new THREE.Vector3(Math.cos(a),0,-Math.sin(a)),right=new THREE.Vector3(-Math.sin(a),0,-Math.cos(a));
 background ||= sphereBackdrop(width,height,r);ctx.clearRect(0,0,width,height);ctx.drawImage(background,0,0);const active=document.getElementById('layer').checked;
 const project=v=>({x:width/2+v.dot(right)*r,y:height/2-v.y*r,front:v.dot(front)>0});
 for(const marker of markers){marker.visible=active;marker.userData.label.hidden=!active;if(!active)continue;marker.userData.isCurrentTopic=marker.userData.id===selected;animateCycloneMarker(marker,time/1000,matchMedia('(prefers-reduced-motion:reduce)').matches);marker.updateMatrixWorld(true);marker.traverse(node=>{if(!node.geometry?.attributes.position || node===marker)return;const values=node.geometry.attributes.position.array,p=[],order=node.isMesh&&node.geometry.index?node.geometry.index.array:Array.from({length:values.length/3},(_,i)=>i);for(const index of order){const i=index*3;p.push(project(new THREE.Vector3(values[i],values[i+1],values[i+2]).applyMatrix4(node.matrixWorld)));}ctx.strokeStyle='#'+node.material.color.getHexString();ctx.fillStyle=ctx.strokeStyle;ctx.globalAlpha=node.material.opacity;ctx.lineWidth=node.parent===marker.userData.cycloneSpiral?2:1;ctx.setLineDash(node.material.isLineDashedMaterial?[5,4]:[]);if(node.isMesh){for(let i=0;i+2<p.length;i+=3){if(!p.slice(i,i+3).every(v=>v.front))continue;ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[i+1].x,p[i+1].y);ctx.lineTo(p[i+2].x,p[i+2].y);ctx.closePath();ctx.fill();}}else if(node.isLineSegments){for(let i=0;i+1<p.length;i+=2){if(!p[i].front||!p[i+1].front)continue;ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[i+1].x,p[i+1].y);ctx.stroke();}}else{ctx.beginPath();let pen=false;for(const v of p){if(!v.front){pen=false;continue;}if(pen)ctx.lineTo(v.x,v.y);else ctx.moveTo(v.x,v.y);pen=true;}ctx.stroke();}});ctx.globalAlpha=1;ctx.setLineDash([]);const pos=project(marker.position);marker.userData.label.hidden=!pos.front;marker.userData.label.style.left=pos.x+'px';marker.userData.label.style.top=(pos.y-22)+'px';}
}
requestAnimationFrame(draw);refresh().catch(error=>{document.getElementById('error').textContent=error.message;});
</script></body></html>
